<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaveIQ — AI Savings Goal Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Figtree,system-ui,sans-serif;background:#eef3f1;color:#10231f}.card{background:#fff;border:1px solid #dbe5e1;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(16,35,31,.04)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:10px 15px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid transparent}.primary{background:#0b6e5f;color:#fff}.primary:hover{background:#084c42}.ghost{background:#fff;border-color:#cbd5d1;color:#10231f}.danger{background:#fff;border-color:#fecaca;color:#b91c1c}.input{width:100%;border:1px solid #cbd5d1;border-radius:9px;padding:10px 12px;background:#fff;outline:none}.input:focus{border-color:#0b6e5f;box-shadow:0 0 0 3px #0b6e5f22}.label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}.progress{height:9px;background:#e2e8e5;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:#0b6e5f;border-radius:999px}.badge{padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}.active{background:#fef3c7;color:#92400e}.completed{background:#d1fae5;color:#065f46}.overdue{background:#fee2e2;color:#991b1b}.sidebar{width:245px}.navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#52615d;cursor:pointer}.navitem:hover,.navitem.sel{background:#d5ebe6;color:#084c42;font-weight:700}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;z-index:99;background:#0b6e5f;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 30px #0002}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modalbox{background:white;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px}.hero{background:linear-gradient(135deg,#084c42,#0b6e5f);color:white}.staticon{width:38px;height:38px;border-radius:10px;background:#d5ebe6;color:#084c42;display:flex;align-items:center;justify-content:center;font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='saveiq_static_v2', SESSION='saveiq_static_user';
const seed=()=>JSON.parse(localStorage.getItem(KEY)||'{"users":[],"goals":[],"transactions":[],"notifications":[],"insights":[]}');
let state=seed(), user=JSON.parse(localStorage.getItem(SESSION)||'null'), charts={};
const $=id=>document.getElementById(id), uid=()=>Date.now()+'_'+Math.random().toString(36).slice(2,8);
const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const date=d=>new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(SESSION,JSON.stringify(user))}
function days(d){return Math.ceil((new Date(d).setHours(23,59,59,999)-Date.now())/86400000)}
function goal(g){let rem=Math.max(0,g.target-g.saved), p=Math.min(100,Math.round(g.target?g.saved/g.target*100:0)), dl=days(g.deadline);return {...g,remaining:rem,progress:p,days:dl,status:g.saved>=g.target?'COMPLETED':dl<0?'OVERDUE':'ACTIVE'}}
function goals(){return state.goals.filter(g=>g.userId===user?.id).map(goal)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(m){const x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
function status(g){return `<span class="badge ${g.status.toLowerCase()}">${g.status}</span>`}
function layout(active,content){
return `<div class="min-h-screen flex"><aside class="sidebar bg-white border-r border-slate-200 p-4 hidden md:block"><div class="text-xl font-extrabold text-[#084c42] mb-8">💰 SaveIQ</div>
<div class="space-y-1">${[['dashboard','▦','Dashboard'],['goals','◎','Goals'],['new','＋','Create Goal'],['notifications','🔔','Notifications'],['profile','◯','Profile']].map(n=>`<div class="navitem ${active===n[0]?'sel':''}" onclick="route('${n[0]}')"><span>${n[1]}</span>${n[2]}</div>`).join('')}</div>
<div class="mt-10 p-3 rounded-xl bg-[#eef3f1] text-xs text-slate-600">AI-powered savings tracking with smart progress insights.</div></aside>
<div class="flex-1 min-w-0"><header class="bg-white border-b border-slate-200 px-4 md:px-8 py-4 flex justify-between items-center"><div class="font-bold md:hidden">💰 SaveIQ</div><div></div><div class="flex items-center gap-3 text-sm"><span>${esc(user.name)}</span><button class="btn ghost" onclick="logout()">Log out</button></div></header>
<nav class="md:hidden bg-white border-b p-2 flex gap-1 overflow-x-auto">${[['dashboard','Dashboard'],['goals','Goals'],['new','New'],['notifications','Alerts'],['profile','Profile']].map(n=>`<button class="btn ${active===n[0]?'primary':'ghost'}" onclick="route('${n[0]}')">${n[1]}</button>`).join('')}</nav>
<main class="p-4 md:p-8 max-w-7xl mx-auto">${content}</main></div></div>`}
function authPage(register=false){
$('app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-md card"><div class="text-center mb-6"><div class="text-3xl mb-2">💰</div><h1 class="text-2xl font-extrabold">SaveIQ</h1><p class="text-slate-500">${register?'Create your account':'Log in to your account'}</p></div>
<form id="authForm" class="space-y-4">${register?`<div><label class="label">Name</label><input id="name" class="input" required></div>`:''}<div><label class="label">Email</label><input id="email" class="input" type="email" required></div><div><label class="label">Password</label><input id="pass" class="input" type="password" minlength="8" required></div>${register?`<div><label class="label">Confirm password</label><input id="confirm" class="input" type="password" required></div>`:''}<p id="authErr" class="text-sm text-red-600"></p><button class="btn primary w-full">${register?'Create account':'Log in'}</button></form>
<p class="text-center text-sm mt-5">${register?'Already have an account?':'New to SaveIQ?'} <button class="text-[#0b6e5f] font-bold" onclick="authPage(${!register})">${register?'Log in':'Create an account'}</button></p>
<div class="mt-5 text-xs text-slate-500 bg-slate-50 p-3 rounded-lg">Demo deployment: account data is stored in this browser using localStorage.</div></div></div>`;
$('authForm').onsubmit=e=>{e.preventDefault();let email=$('email').value.trim().toLowerCase(),pass=$('pass').value;
if(register){if(pass!==$('confirm').value)return $('authErr').textContent='Passwords do not match';if(state.users.some(x=>x.email===email))return $('authErr').textContent='Email already registered';user={id:uid(),name:$('name').value.trim(),email};state.users.push({...user,password:pass});save();route('dashboard')}else{let u=state.users.find(x=>x.email===email&&x.password===pass);if(!u)return $('authErr').textContent='Invalid email or password';user={id:u.id,name:u.name,email:u.email};save();route('dashboard')}}}
function landing(){ $('app').innerHTML=`<div class="min-h-screen"><header class="px-5 md:px-12 py-5 flex justify-between items-center bg-white border-b"><b class="text-xl text-[#084c42]">💰 SaveIQ</b><div class="flex gap-2"><button class="btn ghost" onclick="authPage(false)">Log in</button><button class="btn primary" onclick="authPage(true)">Get Started</button></div></header><section class="hero px-5 py-20 md:py-28"><div class="max-w-5xl mx-auto grid md:grid-cols-2 gap-10 items-center"><div><span class="badge bg-white/20 text-white">AI SAVINGS GOAL TRACKER</span><h1 class="text-4xl md:text-6xl font-extrabold mt-5 leading-tight">Save smarter.<br>Reach your goals faster.</h1><p class="mt-5 text-white/80 text-lg">Plan, track and understand your savings with intelligent progress insights and automated goal monitoring.</p><button class="btn bg-white text-[#084c42] mt-7" onclick="authPage(true)">Start saving →</button></div><div class="card text-slate-800"><div class="flex justify-between"><div><p class="text-sm text-slate-500">Overall savings</p><p class="text-3xl font-extrabold mt-1">₹75,000</p></div><span class="text-3xl">🎯</span></div><div class="progress mt-6"><div style="width:72%"></div></div><p class="text-sm text-slate-500 mt-2">72% of your sample target</p><div class="grid grid-cols-2 gap-3 mt-5"><div class="bg-slate-50 p-3 rounded-lg"><small>Active goals</small><b class="block text-lg">3</b></div><div class="bg-slate-50 p-3 rounded-lg"><small>Completed</small><b class="block text-lg">2</b></div></div></div></div></section><section class="max-w-6xl mx-auto p-6 md:p-14"><h2 class="text-3xl font-extrabold text-center">Everything you need to stay on track</h2><div class="grid md:grid-cols-4 gap-4 mt-8">${[['🤖','AI Insights','Get practical saving targets from your goal progress.'],['📊','Smart Dashboard','See goals, progress and status in one place.'],['🔔','Deadline Alerts','Track approaching and overdue goals.'],['🎯','Goal Tracking','Create, edit and update savings goals easily.']].map(x=>`<div class="card"><div class="text-2xl">${x[0]}</div><h3 class="font-bold mt-3">${x[1]}</h3><p class="text-sm text-slate-500 mt-2">${x[2]}</p></div>`).join('')}</div></section></div>`}
function dashboard(){let gs=goals(),sum={target:gs.reduce((a,g)=>a+g.target,0),saved:gs.reduce((a,g)=>a+g.saved,0)},active=gs.filter(g=>g.status==='ACTIVE').length,completed=gs.filter(g=>g.status==='COMPLETED').length,overdue=gs.filter(g=>g.status==='OVERDUE').length;
let content=`<div class="space-y-6"><div><h1 class="text-2xl font-extrabold">${new Date().getHours()<17?'Good afternoon':'Good evening'}, ${esc(user.name)}</h1><p class="text-slate-500">Here's your savings overview.</p></div><div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">${[['🎯','Total goals',gs.length],['💰','Total target',money(sum.target)],['🐷','Total saved',money(sum.saved)],['⏳','Remaining',money(Math.max(0,sum.target-sum.saved))],['⚡','Active goals',active],['✓','Completed',completed],['⚠','Overdue',overdue]].map(x=>`<div class="card"><div class="staticon">${x[0]}</div><p class="text-sm text-slate-500 mt-3">${x[1]}</p><p class="text-xl font-extrabold">${x[2]}</p></div>`).join('')}</div>`;
if(!gs.length) content+=`<div class="card text-center py-12"><div class="text-4xl">🎯</div><h2 class="text-xl font-bold mt-3">Start your first savings goal</h2><p class="text-slate-500 mt-2">Create a goal and let SaveIQ track your progress.</p><button class="btn primary mt-5" onclick="route('new')">Create goal</button></div>`;
else content+=`<div class="grid lg:grid-cols-2 gap-4"><div class="card"><h3 class="font-bold mb-4">Savings progress</h3><canvas id="progressChart"></canvas></div><div class="card"><h3 class="font-bold mb-4">Goal status</h3><canvas id="statusChart"></canvas></div><div class="card"><h3 class="font-bold mb-4">Target vs saved</h3><canvas id="overallChart"></canvas></div><div class="card"><h3 class="font-bold mb-4">Upcoming deadlines</h3>${gs.filter(g=>g.status==='ACTIVE').sort((a,b)=>a.days-b.days).slice(0,5).map(g=>`<div class="py-3 border-b last:border-0 flex justify-between"><span class="font-semibold">${esc(g.name)}</span><span class="text-sm text-slate-500">${date(g.deadline)} · ${g.days}d</span></div>`).join('')||'<p class="text-sm text-slate-500">No active deadlines.</p>'}</div></div><div class="card"><h3 class="font-bold mb-4">Recent goals</h3><div class="grid md:grid-cols-2 gap-4">${gs.slice(0,4).map(card).join('')}</div></div>`;
$('app').innerHTML=layout('dashboard',content); if(gs.length)setTimeout(drawCharts,50)}
function card(g){return `<div class="border border-slate-200 rounded-xl p-4"><div class="flex justify-between gap-2"><div><button class="font-bold text-left hover:text-[#0b6e5f]" onclick="route('detail','${g.id}')">${esc(g.name)}</button><p class="text-xs text-slate-500">${esc(g.purpose||'No description')}</p></div>${status(g)}</div><div class="progress mt-4"><div style="width:${g.progress}%"></div></div><div class="flex justify-between text-sm mt-2"><b>${money(g.saved)}</b><span>${g.progress}%</span></div><div class="flex justify-between text-xs text-slate-500 mt-2"><span>Remaining ${money(g.remaining)}</span><span>${date(g.deadline)}</span></div></div>`}
function drawCharts(){Object.values(charts).forEach(c=>c.destroy());let gs=goals(),ctx=$('progressChart');if(ctx)charts.p=new Chart(ctx,{type:'bar',data:{labels:gs.map(g=>g.name),datasets:[{label:'Target',data:gs.map(g=>g.target),backgroundColor:'#cbd5e1'},{label:'Saved',data:gs.map(g=>g.saved),backgroundColor:'#0b6e5f'}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}});ctx=$('statusChart');if(ctx)charts.s=new Chart(ctx,{type:'doughnut',data:{labels:['Active','Completed','Overdue'],datasets:[{data:[gs.filter(g=>g.status==='ACTIVE').length,gs.filter(g=>g.status==='COMPLETED').length,gs.filter(g=>g.status==='OVERDUE').length],backgroundColor:['#d69e2e','#0b6e5f','#dc2626']}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}});ctx=$('overallChart');if(ctx)charts.o=new Chart(ctx,{type:'bar',data:{labels:['Target','Saved'],datasets:[{data:[gs.reduce((a,g)=>a+g.target,0),gs.reduce((a,g)=>a+g.saved,0)],backgroundColor:['#cbd5e1','#0b6e5f']}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}})}
function goalsPage(){let gs=goals();$('app').innerHTML=layout('goals',`<div class="space-y-6"><div class="flex justify-between items-center"><div><h1 class="text-2xl font-extrabold">Your goals</h1><p class="text-slate-500">Track every savings target.</p></div><button class="btn primary" onclick="route('new')">＋ New goal</button></div>${gs.length?`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${gs.map(card).join('')}</div>`:`<div class="card text-center py-12">No goals yet. <button class="font-bold text-[#0b6e5f]" onclick="route('new')">Create one</button>.</div>`}</div>`)}
function newPage(edit=null){let g=edit?goal(state.goals.find(x=>x.id===edit)):null;let today=new Date().toISOString().slice(0,10);$('app').innerHTML=layout(edit?'goals':'new',`<div class="max-w-xl mx-auto"><h1 class="text-2xl font-extrabold mb-5">${g?'Edit goal':'Create a savings goal'}</h1><form id="goalForm" class="card space-y-4"><div><label class="label">Goal name</label><input id="gn" class="input" required value="${esc(g?.name||'')}" placeholder="e.g. Laptop Purchase"></div><div class="grid sm:grid-cols-2 gap-4"><div><label class="label">Target amount (₹)</label><input id="gt" class="input" type="number" min="1" required value="${g?.target||''}"></div>${g?'':'<div><label class="label">Initial savings (₹)</label><input id="gs" class="input" type="number" min="0" value="0"></div>'}</div><div><label class="label">Deadline</label><input id="gd" class="input" type="date" min="${today}" required value="${g?.deadline||''}"></div><div><label class="label">Purpose</label><textarea id="gp" class="input" rows="3" placeholder="Why are you saving?">${esc(g?.purpose||'')}</textarea></div><label class="flex items-center gap-2 text-sm"><input id="ge" type="checkbox" ${g?.emailAlerts!==false?'checked':''}> Track deadline alerts</label><p class="text-xs text-slate-500">Alerts are stored locally in this Netlify demo. Real email delivery requires a backend/email provider.</p><p id="gerr" class="text-sm text-red-600"></p><div class="flex gap-2"><button class="btn primary">${g?'Save changes':'Create goal'}</button><button type="button" class="btn ghost" onclick="route('goals')">Cancel</button></div></form></div>`);$('goalForm').onsubmit=e=>{e.preventDefault();let name=$('gn').value.trim(),target=+$('gt').value,saved=g?g.saved:+$('gs').value||0,deadline=$('gd').value;if(!name)return $('gerr').textContent='Goal name is required';if(target<=0)return $('gerr').textContent='Target amount must be greater than 0';if(saved<0)return $('gerr').textContent='Savings cannot be negative';if(!g&&new Date(deadline)<new Date(today))return $('gerr').textContent='Choose a future deadline';if(g){Object.assign(g,{name,target,deadline,purpose:$('gp').value.trim(),emailAlerts:$('ge').checked})}else{let ng={id:uid(),userId:user.id,name,target,saved,deadline,purpose:$('gp').value.trim(),emailAlerts:$('ge').checked,createdAt:new Date().toISOString()};state.goals.push(ng);if(saved)state.transactions.push({id:uid(),goalId:ng.id,amount:saved,createdAt:new Date().toISOString()});}save();toast(g?'Goal updated':'Goal created');route(g?'detail':'goals',g?.id)}}
function detail(id){let g=goals().find(x=>x.id===id);if(!g)return route('goals');let hist=state.transactions.filter(t=>t.goalId===id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));$('app').innerHTML=layout('goals',`<div class="max-w-3xl mx-auto space-y-5"><div class="card"><div class="flex justify-between gap-3"><div><h1 class="text-2xl font-extrabold">${esc(g.name)}</h1><p class="text-slate-500">${esc(g.purpose||'No description')}</p></div>${status(g)}</div><div class="progress mt-5"><div style="width:${g.progress}%"></div></div><div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mt-5">${[['Target',money(g.target)],['Saved',money(g.saved)],['Remaining',money(g.remaining)],['Progress',g.progress+'%'],['Deadline',date(g.deadline)],['Days',g.days>=0?g.days+' left':Math.abs(g.days)+' overdue']].map(x=>`<div><p class="text-xs text-slate-500">${x[0]}</p><b>${x[1]}</b></div>`).join('')}</div><div class="flex flex-wrap gap-2 mt-5"><button class="btn primary" onclick="ai('${id}')">✨ AI Insights</button><button class="btn ghost" onclick="newPage('${id}')">✎ Edit</button><button class="btn danger" onclick="removeGoal('${id}')">Delete</button></div></div><form id="addForm" class="card flex flex-wrap gap-3 items-end"><div class="flex-1 min-w-48"><label class="label">Add savings (₹)</label><input id="addAmt" class="input" type="number" min="1" required></div><button class="btn primary">＋ Add savings</button></form><div id="insight"></div><div class="card"><h2 class="font-bold mb-3">Savings history</h2>${hist.length?`<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b text-left"><th class="py-2">Date</th><th>Amount added</th></tr></thead><tbody>${hist.map(t=>`<tr class="border-b"><td class="py-2">${date(t.createdAt)}</td><td>${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="text-sm text-slate-500">No deposits yet.</p>'}</div></div>`);$('addForm').onsubmit=e=>{e.preventDefault();let a=+$('addAmt').value;if(a<=0)return;let raw=state.goals.find(x=>x.id===id);raw.saved+=a;state.transactions.push({id:uid(),goalId:id,amount:a,createdAt:new Date().toISOString()});save();toast('Savings added');detail(id)}}
function ai(id){let g=goals().find(x=>x.id===id),d=Math.max(1,g.days),daily=Math.ceil(g.remaining/d),weekly=Math.ceil(daily*7),monthly=Math.ceil(daily*30);let insight={goalName:g.name,progressAnalysis:`You have reached ${g.progress}% of your ${money(g.target)} target. ${money(g.remaining)} remains to reach this goal.`,dailySaving:daily,weeklySaving:weekly,monthlySaving:monthly,suggestions:['Set a weekly savings target and review it regularly.','Separate goal savings from everyday spending where practical.','If your deadline becomes difficult, adjust the target or timeline realistically.'],deadlineAdvice:g.status==='OVERDUE'?'This goal is overdue. Consider setting a new realistic deadline.':`Saving about ${money(daily)} per day would cover the remaining amount by ${date(g.deadline)}.`};state.insights.push({id:uid(),goalId:id,insight,createdAt:new Date().toISOString()});save();$('insight').innerHTML=`<div class="card border-[#0b6e5f]/30 bg-[#d5ebe6]/40"><h3 class="font-bold text-[#084c42]">✨ AI Savings Insights</h3><p class="text-sm mt-3">${insight.progressAnalysis}</p><div class="grid grid-cols-3 gap-2 mt-4">${[['Per day',daily],['Per week',weekly],['Per month',monthly]].map(x=>`<div class="bg-white rounded-lg p-3 text-center"><small class="text-slate-500">${x[0]}</small><b class="block">${money(x[1])}</b></div>`).join('')}</div><ul class="list-disc pl-5 mt-4 text-sm space-y-1">${insight.suggestions.map(x=>`<li>${x}</li>`).join('')}</ul><p class="text-sm mt-3"><b>Deadline advice:</b> ${insight.deadlineAdvice}</p><p class="text-xs text-slate-500 mt-3">AI-style recommendations are estimates, not professional financial advice.</p></div>`}
function notifications(){let gs=goals();gs.forEach(g=>{let type=g.status==='COMPLETED'?'COMPLETED':g.status==='OVERDUE'?'OVERDUE':g.days<=7?'UPCOMING':null;if(type&&g.emailAlerts&&!state.notifications.some(n=>n.goalId===g.id&&n.type===type))state.notifications.push({id:uid(),goalId:g.id,type,sentAt:new Date().toISOString(),status:'LOCAL'})});save();let ns=state.notifications.filter(n=>gs.some(g=>g.id===n.goalId)).sort((a,b)=>new Date(b.sentAt)-new Date(a.sentAt));$('app').innerHTML=layout('notifications',`<div class="max-w-2xl mx-auto space-y-4"><h1 class="text-2xl font-extrabold">Notifications</h1>${ns.length?ns.map(n=>{let g=gs.find(x=>x.id===n.goalId);let lab={COMPLETED:'Goal completed',OVERDUE:'Goal overdue',UPCOMING:'Deadline approaching'}[n.type];return `<div class="card flex gap-3 items-center"><div class="text-xl">${n.type==='COMPLETED'?'✓':n.type==='OVERDUE'?'⚠':'🔔'}</div><div class="flex-1"><b>${lab}: ${esc(g.name)}</b><p class="text-xs text-slate-500">${date(n.sentAt)}</p></div><span class="text-xs text-slate-500">Local alert</span></div>`}).join(''):`<div class="card text-sm text-slate-500">No alerts yet. Alerts appear when a deadline is near, a goal is completed or a goal becomes overdue.</div>`}<div class="text-xs text-slate-500">For security and reliability, actual email delivery requires a server-side email service; this upload-ready version does not expose email credentials in the browser.</div></div>`)}
function profile(){$('app').innerHTML=layout('profile',`<div class="max-w-md mx-auto space-y-4"><h1 class="text-2xl font-extrabold">Profile</h1><div class="card space-y-4"><div><p class="text-xs text-slate-500">Name</p><b>${esc(user.name)}</b></div><div><p class="text-xs text-slate-500">Email</p><b>${esc(user.email)}</b></div><p class="text-sm text-slate-500">Your goals and demo data are stored in this browser.</p><button class="btn danger" onclick="logout()">Log out</button></div></div>`)}
function logout(){user=null;localStorage.removeItem(SESSION);landing()}
function route(p,id){if(!user)return landing();if(p==='dashboard')dashboard();else if(p==='goals')goalsPage();else if(p==='new')newPage();else if(p==='detail')detail(id);else if(p==='notifications')notifications();else if(p==='profile')profile();window.scrollTo(0,0)}
